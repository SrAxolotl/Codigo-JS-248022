<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
<img src="https://cdn.pixabay.com/photo/2016/11/29/03/53/fire-1867277_960_720.jpg" alt="Incendio" width="500">
<script>
   // Variable de temperatura
let temperatura = 45;

// Estructura if - else
if (temperatura > 50) {
    console.log("Incendio extremo");
} else if (temperatura > 30) {
    console.log("Fuego activo");
} else if (temperatura > 10) {
    console.log("Calor leve");
} else {
    console.log("Sin fuego");
}

// Variable tipo de fuego
let tipoFuego = "forestal";

// Estructura switch
switch (tipoFuego) {
    case "forestal":
        console.log("Incendio en bosque");
        break;
    case "urbano":
        console.log("Incendio en ciudad");
        break;
    case "industrial":
        console.log("Incendio en fábrica");
        break;
    default:
        console.log("Tipo de fuego desconocido");
}

// Bucle for (simula propagación del fuego)
for (let i = 1; i <= 5; i++) {
    console.log("El fuego se expande nivel: " + i);
}

// Bucle while (controlando extinción)
let agua = 3;

while (agua > 0) {
    console.log("Usando agua para apagar el fuego...");
    agua--;
}

console.log("El fuego ha sido controlado");
    </script>
</body>
</html>
